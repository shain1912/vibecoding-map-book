<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ch14-f06</title>
<style>
  body { margin: 0; background: #fff; font-family: 'Malgun Gothic', sans-serif; }
  #canvas { width: 1200px; height: 750px; position: relative; background: #fff; overflow: hidden; box-sizing: border-box; }
  .title { position: absolute; top: 42px; width: 100%; text-align: center; font-size: 30px; font-weight: bold; color: #334155; }
  .entry { position: absolute; left: 70px; width: 250px; height: 110px; border-radius: 14px; background: #ffedd5; border: 3px solid #f97316; color: #9a3412; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .entry .label { font-size: 22px; font-weight: bold; }
  .entry .icon { font-size: 32px; margin-bottom: 6px; }
  .state { position: absolute; left: 545px; top: 300px; width: 190px; height: 150px; border-radius: 16px; background: #ccfbf1; border: 4px solid #0d9488; color: #134e4a; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .state .icon { font-size: 40px; }
  .state .label { font-size: 26px; font-weight: bold; margin-top: 6px; }
  .rr { position: absolute; left: 800px; top: 315px; width: 180px; height: 120px; border-radius: 60px; background: #f97316; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 25px; font-weight: bold; }
  .screen { position: absolute; left: 1030px; top: 290px; width: 140px; height: 170px; border-radius: 14px; background: #f1f5f9; border: 3px solid #64748b; color: #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .screen .icon { font-size: 44px; }
  .screen .label { font-size: 22px; font-weight: bold; margin-top: 8px; }
  .caption { position: absolute; top: 640px; width: 100%; text-align: center; font-size: 22px; color: #64748b; }
</style>
</head>
<body>
<div id="canvas" style="width:1200px;height:750px;">
  <div class="title">rerender 하나로 모이는 구조</div>

  <div class="entry" style="top:150px;">
    <div class="icon">🔀</div>
    <div class="label">필터 변경</div>
  </div>
  <div class="entry" style="top:320px;">
    <div class="icon">➕</div>
    <div class="label">장소 추가(16장)</div>
  </div>
  <div class="entry" style="top:490px;">
    <div class="icon">🗑️</div>
    <div class="label">장소 삭제(19장)</div>
  </div>

  <!-- funnel arrows: entrances -> state -->
  <svg style="position:absolute;left:0;top:0;" width="1200" height="750" viewBox="0 0 1200 750">
    <defs>
      <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <polygon points="0,0 10,5 0,10" fill="#0d9488"/>
      </marker>
      <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <polygon points="0,0 10,5 0,10" fill="#f97316"/>
      </marker>
    </defs>
    <line x1="325" y1="205" x2="535" y2="345" stroke="#0d9488" stroke-width="6" marker-end="url(#ah)"/>
    <line x1="325" y1="375" x2="535" y2="375" stroke="#0d9488" stroke-width="6" marker-end="url(#ah)"/>
    <line x1="325" y1="545" x2="535" y2="405" stroke="#0d9488" stroke-width="6" marker-end="url(#ah)"/>
    <!-- state -> rerender -->
    <line x1="740" y1="375" x2="790" y2="375" stroke="#f97316" stroke-width="6" marker-end="url(#ao)"/>
    <!-- rerender -> screen -->
    <line x1="985" y1="375" x2="1020" y2="375" stroke="#f97316" stroke-width="6" marker-end="url(#ao)"/>
  </svg>

  <div class="state">
    <div class="icon">📦</div>
    <div class="label">상태</div>
  </div>
  <div class="rr">rerender()</div>
  <div class="screen">
    <div class="icon">🗺️</div>
    <div class="label">지도 화면</div>
  </div>

  <div class="caption">필터·추가·삭제 — 어떤 변화든 같은 길을 거쳐 화면이 됩니다</div>
</div>
</body>
</html>
