<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ch21-f04</title>
<style>
  body { margin: 0; background: #fff; font-family: 'Malgun Gothic', sans-serif; }
  #canvas { width: 1200px; height: 750px; position: relative; background: #fff; overflow: hidden; box-sizing: border-box; }
  .title { position: absolute; top: 34px; width: 100%; text-align: center; font-size: 30px; font-weight: bold; color: #334155; }
  .browser { position: absolute; top: 160px; width: 380px; height: 400px; border-radius: 16px; background: #fff; border: 4px solid; box-sizing: border-box; }
  .bA { left: 60px; border-color: #0d9488; }
  .bB { left: 760px; border-color: #f97316; }
  .bbar { height: 52px; display: flex; align-items: center; padding: 0 16px; border-radius: 12px 12px 0 0; color: #fff; font-size: 23px; font-weight: bold; }
  .bA .bbar { background: #0d9488; }
  .bB .bbar { background: #f97316; }
  .bbody { padding: 20px; }
  .step { font-size: 22px; font-weight: bold; margin: 14px 0; display: flex; align-items: center; gap: 10px; line-height: 1.4; }
  .bA .step { color: #134e4a; }
  .bB .step { color: #9a3412; }
  .chip { display: inline-block; background: #f1f5f9; border: 2px solid #94a3b8; border-radius: 8px; padding: 4px 10px; font-family: Consolas, monospace; font-size: 20px; color: #334155; }
  .msgr { position: absolute; left: 545px; top: 300px; width: 110px; text-align: center; }
  .msgr .icon { font-size: 70px; }
  .msgr .label { font-size: 22px; font-weight: bold; color: #334155; margin-top: 4px; }
  .toplabel, .botlabel { position: absolute; width: 100%; text-align: center; font-size: 24px; font-weight: bold; }
  .toplabel { top: 105px; color: #0d9488; }
  .botlabel { top: 620px; color: #f97316; }
</style>
</head>
<body>
<div id="canvas" style="width:1200px;height:750px;">
  <div class="title">공유의 왕복 — 인코딩(쓰기)과 파싱(읽기)의 흐름</div>

  <div class="toplabel">쓰기(인코딩) ⟶</div>

  <div class="browser bA">
    <div class="bbar">🌐 브라우저 A — 보내는 쪽</div>
    <div class="bbody">
      <div class="step">① getCenter / getLevel</div>
      <div class="step">② <span class="chip">#37.5,127.0,4</span></div>
      <div class="step">③ 📋 클립보드 복사</div>
    </div>
  </div>

  <div class="msgr">
    <div class="icon">💬</div>
    <div class="label">메신저</div>
  </div>

  <div class="browser bB">
    <div class="bbar">🌐 브라우저 B — 받는 쪽</div>
    <div class="bbody">
      <div class="step">④ 링크 클릭 → 접속</div>
      <div class="step">⑤ parseHash</div>
      <div class="step">⑥ createMap<br>&nbsp;&nbsp;&nbsp;&nbsp;(같은 위치 🗺️📍)</div>
    </div>
  </div>

  <!-- circular arrows -->
  <svg style="position:absolute;left:0;top:0;" width="1200" height="750" viewBox="0 0 1200 750">
    <defs>
      <marker id="aT" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <polygon points="0,0 10,5 0,10" fill="#0d9488"/>
      </marker>
      <marker id="aO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <polygon points="0,0 10,5 0,10" fill="#f97316"/>
      </marker>
    </defs>
    <!-- A -> messenger -> B (top arc) -->
    <path d="M445 220 C 530 150, 670 150, 755 220" fill="none" stroke="#0d9488" stroke-width="7" marker-end="url(#aT)"/>
    <!-- A -> messenger short -->
    <line x1="445" y1="340" x2="535" y2="340" stroke="#0d9488" stroke-width="6" marker-end="url(#aT)"/>
    <line x1="665" y1="340" x2="750" y2="340" stroke="#0d9488" stroke-width="6" marker-end="url(#aT)"/>
    <!-- return arc (B bottom -> A bottom): 왕복 순환 -->
    <path d="M755 585 C 670 665, 530 665, 445 585" fill="none" stroke="#f97316" stroke-width="7" stroke-dasharray="16 10" marker-end="url(#aO)"/>
  </svg>

  <div class="botlabel">⟵ 같은 링크로 언제든 같은 장면이 다시 열립니다 (읽기·파싱)</div>
</div>
</body>
</html>
