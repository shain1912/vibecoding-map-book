<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ch17-f02</title>
<style>
  body { margin: 0; background: #fff; font-family: 'Malgun Gothic', sans-serif; }
  #canvas { width: 1200px; height: 750px; position: relative; background: #fff; overflow: hidden; box-sizing: border-box; }
  .title { position: absolute; top: 44px; width: 100%; text-align: center; font-size: 32px; font-weight: bold; color: #334155; }
  .side { position: absolute; top: 150px; width: 420px; height: 440px; border-radius: 20px; box-sizing: border-box; padding: 26px; text-align: center; }
  .desk { left: 80px; background: #ffedd5; border: 4px solid #f97316; color: #9a3412; }
  .drawer { left: 700px; background: #ccfbf1; border: 4px solid #0d9488; color: #134e4a; }
  .side h2 { margin: 0; font-size: 28px; }
  .side .icon { font-size: 80px; margin: 14px 0 8px; }
  .side ul { list-style: none; margin: 14px 0 0; padding: 0; font-size: 23px; line-height: 1.9; text-align: center; }
  .midlabel { position: absolute; width: 200px; left: 500px; text-align: center; font-size: 26px; font-weight: bold; }
  .savel { top: 285px; color: #0d9488; }
  .loadl { top: 425px; color: #f97316; }
  .caption { position: absolute; top: 645px; width: 100%; text-align: center; font-size: 22px; color: #64748b; }
</style>
</head>
<body>
<div id="canvas" style="width:1200px;height:750px;">
  <div class="title">책상(메모리)과 서랍(localStorage)</div>

  <div class="side desk">
    <h2>책상 위 — 메모리</h2>
    <div class="icon">🗂️</div>
    <ul>
      <li><b>places 변수</b></li>
      <li>빠름</li>
      <li>새로고침하면 <b>증발</b> 💨</li>
    </ul>
  </div>

  <div class="side drawer">
    <h2>서랍 — localStorage</h2>
    <div class="icon">🗄️🔒</div>
    <ul>
      <li>키-값 저장소</li>
      <li>여닫기는 번거로움</li>
      <li>새로고침에도 <b>유지</b> ✅</li>
    </ul>
  </div>

  <!-- bidirectional arrows -->
  <svg style="position:absolute;left:500px;top:300px;" width="200" height="200" viewBox="0 0 200 200">
    <defs>
      <marker id="ahT" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <polygon points="0,0 10,5 0,10" fill="#0d9488"/>
      </marker>
      <marker id="ahO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <polygon points="0,0 10,5 0,10" fill="#f97316"/>
      </marker>
    </defs>
    <!-- save(): desk -> drawer -->
    <line x1="10" y1="35" x2="180" y2="35" stroke="#0d9488" stroke-width="7" marker-end="url(#ahT)"/>
    <!-- load(): drawer -> desk -->
    <line x1="190" y1="165" x2="20" y2="165" stroke="#f97316" stroke-width="7" marker-end="url(#ahO)"/>
  </svg>
  <div class="midlabel savel">save()</div>
  <div class="midlabel loadl">load()</div>

  <div class="caption">퇴근(새로고침) 전에 save()로 서랍에 넣고, 출근하면 load()로 다시 꺼냅니다</div>
</div>
</body>
</html>
