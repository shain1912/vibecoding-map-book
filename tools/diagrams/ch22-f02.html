<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>그림 22.2 — 클러스터링 개념도</title>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  *{box-sizing:border-box;font-family:'Malgun Gothic',sans-serif;}
</style>
</head>
<body>
<div id="canvas" style="width:1200px;height:750px;position:relative;background:#fff;overflow:hidden;">

  <div style="position:absolute;top:24px;left:0;width:1200px;text-align:center;font-size:32px;font-weight:bold;color:#374151;">클러스터링 개념도</div>

  <!-- 왼쪽: 클러스터링 전 -->
  <div style="position:absolute;top:88px;left:60px;width:490px;">
    <div style="text-align:center;font-size:26px;font-weight:bold;color:#f97316;margin-bottom:12px;">클러스터링 전</div>
    <div style="width:490px;height:400px;background:#e6f2ea;border:3px solid #9ca3af;border-radius:12px;position:relative;">
      <!-- 지도 느낌: 도로 -->
      <svg width="484" height="394" style="position:absolute;top:0;left:0;">
        <path d="M0,120 L484,90" stroke="#ffffff" stroke-width="14" fill="none"/>
        <path d="M0,280 L484,310" stroke="#ffffff" stroke-width="14" fill="none"/>
        <path d="M150,0 L180,394" stroke="#ffffff" stroke-width="12" fill="none"/>
        <path d="M360,0 L330,394" stroke="#ffffff" stroke-width="12" fill="none"/>
      </svg>
      <!-- 겹친 핀 11개 -->
      <div style="position:absolute;top:70px;left:70px;font-size:44px;">📍</div>
      <div style="position:absolute;top:95px;left:100px;font-size:44px;">📍</div>
      <div style="position:absolute;top:60px;left:130px;font-size:44px;">📍</div>
      <div style="position:absolute;top:110px;left:60px;font-size:44px;">📍</div>
      <div style="position:absolute;top:120px;left:125px;font-size:44px;">📍</div>
      <div style="position:absolute;top:88px;left:160px;font-size:44px;">📍</div>
      <div style="position:absolute;top:135px;left:95px;font-size:44px;">📍</div>
      <div style="position:absolute;top:210px;left:300px;font-size:44px;">📍</div>
      <div style="position:absolute;top:235px;left:335px;font-size:44px;">📍</div>
      <div style="position:absolute;top:200px;left:360px;font-size:44px;">📍</div>
      <div style="position:absolute;top:250px;left:300px;font-size:44px;">📍</div>
      <div style="position:absolute;top:300px;left:180px;font-size:44px;">📍</div>
      <div style="position:absolute;bottom:12px;left:0;width:100%;text-align:center;font-size:22px;color:#6b7280;">핀이 겹쳐서 지저분!</div>
    </div>
  </div>

  <!-- 가운데 화살표 -->
  <svg width="90" height="60" style="position:absolute;top:300px;left:555px;">
    <defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0d9488"/></marker></defs>
    <line x1="5" y1="30" x2="75" y2="30" stroke="#0d9488" stroke-width="8" marker-end="url(#ah)"/>
  </svg>

  <!-- 오른쪽: 클러스터링 후 -->
  <div style="position:absolute;top:88px;left:650px;width:490px;">
    <div style="text-align:center;font-size:26px;font-weight:bold;color:#0d9488;margin-bottom:12px;">클러스터링 후</div>
    <div style="width:490px;height:400px;background:#e6f2ea;border:3px solid #0d9488;border-radius:12px;position:relative;">
      <svg width="484" height="394" style="position:absolute;top:0;left:0;">
        <path d="M0,120 L484,90" stroke="#ffffff" stroke-width="14" fill="none"/>
        <path d="M0,280 L484,310" stroke="#ffffff" stroke-width="14" fill="none"/>
        <path d="M150,0 L180,394" stroke="#ffffff" stroke-width="12" fill="none"/>
        <path d="M360,0 L330,394" stroke="#ffffff" stroke-width="12" fill="none"/>
      </svg>
      <!-- 숫자 원 두 개 -->
      <div style="position:absolute;top:70px;left:80px;width:96px;height:96px;border-radius:50%;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:bold;border:5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);">7</div>
      <div style="position:absolute;top:195px;left:300px;width:80px;height:80px;border-radius:50%;background:#f97316;color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:bold;border:5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);">4</div>
      <!-- 낱개 핀 1개 -->
      <div style="position:absolute;top:295px;left:180px;font-size:44px;">📍</div>
      <div style="position:absolute;bottom:12px;left:0;width:100%;text-align:center;font-size:22px;color:#0d9488;font-weight:bold;">숫자 원으로 깔끔하게!</div>
    </div>
  </div>

  <!-- 하단: 확대하면 다시 낱개 핀으로 -->
  <div style="position:absolute;top:560px;left:0;width:1200px;display:flex;align-items:center;justify-content:center;gap:24px;">
    <div style="font-size:56px;">🔍</div>
    <svg width="180" height="60">
      <defs><marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f97316"/></marker></defs>
      <line x1="10" y1="30" x2="160" y2="30" stroke="#f97316" stroke-width="7" marker-end="url(#ah2)"/>
    </svg>
    <div style="font-size:28px;font-weight:bold;color:#374151;">확대하면 다시 낱개 핀으로</div>
    <div style="font-size:48px;">📍📍📍</div>
  </div>

  <div style="position:absolute;bottom:24px;left:0;width:1200px;text-align:center;font-size:22px;color:#6b7280;">가까운 마커끼리 묶고, 원 안의 숫자로 개수만 보여 준다</div>
</div>
</body>
</html>
