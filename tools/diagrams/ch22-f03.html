<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ch22-f03</title>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  *{box-sizing:border-box;}
  #canvas{width:1100px;height:620px;position:relative;background:#fff;overflow:hidden;
    font-family:'Consolas','D2Coding','Menlo',monospace;}
  .tabbar{height:42px;background:#f3f3f3;border-bottom:1px solid #cfcfcf;display:flex;align-items:stretch;
    font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:14.5px;}
  .tab{padding:0 18px;display:flex;align-items:center;color:#5f6368;}
  .tab.active{color:#1a73e8;box-shadow:inset 0 -2px 0 #1a73e8;font-weight:600;}
  .tabbar .sp{flex:1;}
  .tabbar .icons{display:flex;align-items:center;gap:14px;padding:0 16px;color:#9aa0a6;font-size:16px;}
  .filterbar{height:36px;background:#f3f3f3;border-bottom:1px solid #cfcfcf;display:flex;align-items:center;
    gap:12px;padding:0 12px;font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:13px;color:#5f6368;}
  .ico{color:#7a7a7a;font-size:15px;}
  .filterbox{flex:0 0 260px;height:23px;border:1px solid #c9c9c9;border-radius:4px;background:#fff;
    display:flex;align-items:center;padding:0 8px;color:#9aa0a6;font-size:13px;}
  .levels{display:flex;align-items:center;gap:6px;color:#3c4043;}
  .caret{font-size:10px;color:#7a7a7a;}
  .console{position:absolute;top:78px;left:0;right:0;bottom:0;background:#fff;padding:2px 0;
    font-size:16px;line-height:1.6;color:#080808;}
  .row{padding:5px 12px 5px 32px;position:relative;border-bottom:1px solid #f0f0f0;white-space:pre-wrap;word-break:break-all;}
  .row.input::before{content:">";position:absolute;left:13px;color:#1a73e8;font-weight:bold;}
  .row.result::before{content:"<";position:absolute;left:13px;color:#9aa0a6;font-weight:bold;}
  .row.result{color:#5f6368;}
  .row.comment{color:#3f7f3f;border-bottom:1px solid #f7f7f7;padding-top:10px;}
  .muted{color:#9aa0a6;}
  .fn{color:#5f6368;}
  .fnk{color:#a11ca1;font-style:italic;}
</style>
</head>
<body>
<div id="canvas">
  <div class="tabbar">
    <div class="tab">Elements</div>
    <div class="tab active">Console</div>
    <div class="tab">Sources</div>
    <div class="tab">Network</div>
    <div class="tab">Application</div>
    <div class="sp"></div>
    <div class="icons"><span>&#9881;</span><span>&#10005;</span></div>
  </div>
  <div class="filterbar">
    <span class="ico">&#8856;</span>
    <span class="ico">&#128269;</span>
    <span class="filterbox">Filter</span>
    <span class="levels">Default levels <span class="caret">&#9660;</span></span>
  </div>
  <div class="console">
    <div class="row comment">// services만 로드한 탭에서는:</div>
    <div class="row input">kakao.maps.MarkerClusterer</div>
    <div class="row result"><span class="muted">undefined</span></div>
    <div class="row comment">// clusterer 라이브러리까지 URL에 추가한 탭에서는:</div>
    <div class="row input">kakao.maps.MarkerClusterer</div>
    <div class="row result"><span class="fnk">&fnof;</span> <span class="fn">MarkerClusterer()</span></div>
  </div>
</div>
</body>
</html>
