<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ch18-f06</title>
<style>
  body { margin: 0; background: #fff; font-family: 'Malgun Gothic', sans-serif; }
  #canvas { width: 1200px; height: 750px; position: relative; background: #fff; overflow: hidden; box-sizing: border-box; }
  .title { position: absolute; top: 34px; width: 100%; text-align: center; font-size: 29px; font-weight: bold; color: #334155; }
  .entry { position: absolute; left: 60px; width: 260px; height: 100px; border-radius: 14px; background: #ffedd5; border: 3px solid #f97316; color: #9a3412; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 22px; font-weight: bold; padding: 6px; box-sizing: border-box; }
  .savebox { position: absolute; left: 500px; top: 300px; width: 230px; height: 160px; border-radius: 16px; background: #ccfbf1; border: 4px solid #0d9488; color: #134e4a; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .savebox .icon { font-size: 44px; }
  .savebox .label { font-size: 26px; font-weight: bold; margin-top: 6px; }
  .sub { position: absolute; width: 300px; height: 130px; border-radius: 14px; background: #f1f5f9; border: 3px solid #64748b; color: #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8px; box-sizing: border-box; }
  .sub .label { font-size: 23px; font-weight: bold; line-height: 1.4; }
  .sub .tag { font-size: 19px; color: #0d9488; font-weight: bold; margin-top: 6px; }
  .caption { position: absolute; top: 685px; width: 100%; text-align: center; font-size: 21px; color: #64748b; }
</style>
</head>
<body>
<div id="canvas" style="width:1200px;height:750px;">
  <div class="title">구독 패턴 — 어떤 경로든 save()가 방송하고, 구독자가 각자 갱신한다</div>

  <div class="entry" style="top:110px;">🗺 지도 클릭 추가</div>
  <div class="entry" style="top:250px;">🔍 검색 추가</div>
  <div class="entry" style="top:390px;">📂 가져오기</div>
  <div class="entry" style="top:530px;">✏️ 수정·삭제(19장)</div>

  <svg style="position:absolute;left:0;top:0;" width="1200" height="750" viewBox="0 0 1200 750">
    <defs>
      <marker id="aT" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <polygon points="0,0 10,5 0,10" fill="#0d9488"/>
      </marker>
      <marker id="aO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <polygon points="0,0 10,5 0,10" fill="#f97316"/>
      </marker>
    </defs>
    <!-- entrances -> save -->
    <line x1="325" y1="160" x2="490" y2="330" stroke="#0d9488" stroke-width="6" marker-end="url(#aT)"/>
    <line x1="325" y1="300" x2="490" y2="365" stroke="#0d9488" stroke-width="6" marker-end="url(#aT)"/>
    <line x1="325" y1="440" x2="490" y2="395" stroke="#0d9488" stroke-width="6" marker-end="url(#aT)"/>
    <line x1="325" y1="580" x2="490" y2="430" stroke="#0d9488" stroke-width="6" marker-end="url(#aT)"/>
    <!-- broadcast: save -> subscribers -->
    <line x1="740" y1="345" x2="865" y2="255" stroke="#f97316" stroke-width="6" marker-end="url(#aO)"/>
    <line x1="740" y1="415" x2="865" y2="505" stroke="#f97316" stroke-width="6" marker-end="url(#aO)"/>
    <!-- broadcast waves -->
    <path d="M760 300 A 55 55 0 0 1 760 460" fill="none" stroke="#f97316" stroke-width="3" opacity="0.55"/>
    <path d="M785 275 A 90 90 0 0 1 785 485" fill="none" stroke="#f97316" stroke-width="3" opacity="0.35"/>
  </svg>

  <div class="savebox">
    <div class="icon">📢</div>
    <div class="label">store.save()</div>
  </div>

  <div class="sub" style="left:880px; top:170px;">
    <div class="label">rerender() → 지도</div>
    <div class="tag">구독자 1</div>
  </div>
  <div class="sub" style="left:880px; top:450px;">
    <div class="label">renderList() → 목록</div>
    <div class="tag">구독자 2</div>
  </div>

  <div class="caption">데이터를 바꾸는 쪽은 화면을 모릅니다 — save()의 방송을 들은 구독자들이 각자 따라옵니다</div>
</div>
</body>
</html>
