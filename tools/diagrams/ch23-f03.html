<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>그림 23.3 — 미디어쿼리 개념</title>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  *{box-sizing:border-box;font-family:'Malgun Gothic',sans-serif;}
</style>
</head>
<body>
<div id="canvas" style="width:1200px;height:750px;position:relative;background:#fff;overflow:hidden;">

  <div style="position:absolute;top:22px;left:0;width:1200px;text-align:center;font-size:30px;font-weight:bold;color:#374151;">미디어쿼리 개념 — 같은 HTML이 화면 폭에 따라 다른 CSS 옷을 입는다</div>

  <!-- 가운데 HTML 문서 아이콘 -->
  <div style="position:absolute;top:270px;left:530px;width:140px;text-align:center;">
    <div style="width:120px;height:150px;margin:0 auto;background:#f9fafb;border:4px solid #374151;border-radius:10px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <div style="font-size:44px;">📄</div>
      <div style="font-size:24px;font-weight:bold;color:#374151;margin-top:6px;">HTML</div>
    </div>
    <div style="font-size:20px;color:#6b7280;margin-top:8px;">문서는 하나</div>
  </div>

  <!-- 왼쪽 화살표 -->
  <svg width="180" height="80" style="position:absolute;top:320px;left:345px;">
    <defs><marker id="al" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0d9488"/></marker></defs>
    <line x1="170" y1="40" x2="15" y2="40" stroke="#0d9488" stroke-width="7" marker-end="url(#al)"/>
  </svg>

  <!-- 오른쪽 화살표 -->
  <svg width="180" height="80" style="position:absolute;top:320px;left:675px;">
    <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f97316"/></marker></defs>
    <line x1="10" y1="40" x2="165" y2="40" stroke="#f97316" stroke-width="7" marker-end="url(#ar)"/>
  </svg>

  <!-- 왼쪽: 넓은 모니터 -->
  <div style="position:absolute;top:170px;left:40px;width:300px;text-align:center;">
    <!-- 모니터 -->
    <div style="width:300px;height:200px;background:#374151;border-radius:12px;padding:10px;">
      <div style="width:100%;height:100%;background:#fff;border-radius:6px;display:flex;overflow:hidden;">
        <div style="width:34%;background:#0d9488;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:bold;">사이드바</div>
        <div style="width:66%;background:#e6f2ea;display:flex;align-items:center;justify-content:center;font-size:20px;color:#374151;">지도 🗺️</div>
      </div>
    </div>
    <div style="width:90px;height:14px;background:#6b7280;margin:0 auto;"></div>
    <div style="width:150px;height:10px;background:#9ca3af;margin:0 auto;border-radius:4px;"></div>
    <div style="margin-top:16px;font-size:23px;font-weight:bold;color:#0d9488;">기본 CSS</div>
    <div style="font-size:21px;color:#374151;">사이드바 + 지도 나란히</div>
  </div>

  <!-- 오른쪽: 스마트폰 -->
  <div style="position:absolute;top:130px;left:930px;width:240px;text-align:center;">
    <div style="width:150px;height:280px;background:#374151;border-radius:22px;padding:10px;margin:0 auto;">
      <div style="width:100%;height:100%;background:#e6f2ea;border-radius:12px;position:relative;overflow:hidden;">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#374151;">지도 🗺️</div>
        <!-- 겹친 사이드바 -->
        <div style="position:absolute;top:0;left:0;width:84%;height:100%;background:rgba(13,148,136,0.93);box-shadow:6px 0 12px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:bold;writing-mode:initial;">사이드바<br>(겹침)</div>
      </div>
    </div>
    <div style="margin-top:16px;font-size:23px;font-weight:bold;color:#f97316;">@media ≤640px</div>
    <div style="font-size:21px;color:#374151;">사이드바가 지도 위에 겹침</div>
  </div>

  <!-- 640px 브레이크포인트 점선 -->
  <svg width="1200" height="180" style="position:absolute;top:540px;left:0;">
    <!-- 폭 축 -->
    <line x1="100" y1="70" x2="1100" y2="70" stroke="#9ca3af" stroke-width="4"/>
    <text x="110" y="110" font-size="21" fill="#6b7280">좁은 화면 (폰 360~430px)</text>
    <text x="880" y="110" font-size="21" fill="#6b7280">넓은 화면 (태블릿·PC)</text>
    <!-- 브레이크포인트 -->
    <line x1="600" y1="10" x2="600" y2="130" stroke="#f97316" stroke-width="4" stroke-dasharray="10 7"/>
    <rect x="490" y="132" width="220" height="42" rx="21" fill="#f97316"/>
    <text x="600" y="161" text-anchor="middle" font-size="23" font-weight="bold" fill="#fff">브레이크포인트 640px</text>
    <text x="600" y="40" text-anchor="middle" font-size="20" fill="#f97316" font-weight="bold">배치가 꺾이는 지점</text>
  </svg>
</div>
</body>
</html>
